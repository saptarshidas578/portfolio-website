<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-ac" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#18131d" />
      <stop offset="50%" stop-color="#0b0811" />
      <stop offset="100%" stop-color="#030205" />
    </radialGradient>

    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="ac-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="ct-copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', monospace, 'Courier New'; }
    .sans { font-family: 'Space Grotesk', -apple-system, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bg-ac)" />

  <!-- Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M 0,75 L 1200,75 M 0,150 L 1200,150 M 0,225 L 1200,225 M 0,300 L 1200,300 M 0,375 L 1200,375 M 0,450 L 1200,450 M 0,525 L 1200,525 M 0,600 L 1200,600" />
    <path d="M 100,0 L 100,675 M 200,0 L 200,675 M 300,0 L 300,675 M 400,0 L 400,675 M 500,0 L 500,675 M 600,0 L 600,675 M 700,0 L 700,675 M 800,0 L 800,675 M 900,0 L 900,675 M 1000,0 L 1000,675 M 1100,0 L 1100,675" />
  </g>

  <!-- Title Banner -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="540" height="42" rx="6" fill="#18131e" stroke="#47324f" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#f59e0b" filter="url(#glow-amber)" />
    <text x="36" y="26" fill="#f8fafc" class="mono" font-size="13" font-weight="bold" letter-spacing="1.5">POWER_ELEC // CUSTOM AC CURRENT &amp; VOLTAGE TELEMETRY</text>
    <text x="430" y="26" fill="#f59e0b" class="mono" font-size="11">ISOLATED 230V</text>
  </g>

  <!-- High-Voltage Mains Infeed -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="160" height="340" rx="10" fill="#140f1a" stroke="#ef4444" stroke-width="1.8" />
    <text x="80" y="30" fill="#ef4444" class="mono" font-size="11" text-anchor="middle" font-weight="bold">MAINS 230V AC</text>
    <text x="80" y="46" fill="#94a3b8" class="mono" font-size="8.5" text-anchor="middle">50Hz PHASE / NEUTRAL</text>
    
    <!-- Mains Terminals -->
    <circle cx="50" cy="100" r="14" fill="#3f1414" stroke="#ef4444" stroke-width="2" />
    <circle cx="50" cy="100" r="5" fill="#ef4444" filter="url(#glow-amber)" />
    <text x="50" y="130" fill="#ef4444" class="mono" font-size="10" text-anchor="middle" font-weight="bold">L (PHASE)</text>

    <circle cx="110" cy="100" r="14" fill="#141c2e" stroke="#38bdf8" stroke-width="2" />
    <circle cx="110" cy="100" r="5" fill="#38bdf8" filter="url(#glow-cyan2)" />
    <text x="110" y="130" fill="#38bdf8" class="mono" font-size="10" text-anchor="middle" font-weight="bold">N (NEUTRAL)</text>

    <!-- Solid State Relay Interlock -->
    <g transform="translate(15, 180)">
      <rect x="0" y="0" width="130" height="120" rx="6" fill="#0c0812" stroke="#6b21a8" stroke-width="1.5" />
      <text x="65" y="24" fill="#c084fc" class="mono" font-size="10" text-anchor="middle" font-weight="bold">SSR RELAY</text>
      <text x="65" y="40" fill="#94a3b8" class="mono" font-size="8" text-anchor="middle">Opto-Isolated Triac</text>
      <path d="M 20,70 L 45,70 L 65,55 L 85,70 L 110,70" stroke="#f59e0b" stroke-width="2" fill="none" />
      <text x="65" y="100" fill="#34d399" class="mono" font-size="8.5" text-anchor="middle" font-weight="bold">STATUS: ARMED</text>
    </g>
  </g>

  <!-- Toroidal Current Transformer (Homemade CT Coil Detail) -->
  <g transform="translate(300, 200)">
    <!-- Heavy Phase Wire passing through Toroid Center -->
    <path d="M -60,110 L 180,110" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
    
    <!-- Toroid Core Ring -->
    <circle cx="60" cy="110" r="75" fill="none" stroke="#2a1f14" stroke-width="32" />
    <!-- Copper Wire Windings (1000:1 ratio simulation) -->
    <circle cx="60" cy="110" r="75" fill="none" stroke="url(#ct-copper)" stroke-width="28" stroke-dasharray="7 5" filter="url(#glow-amber)" />
    <circle cx="60" cy="110" r="45" fill="#08060a" stroke="#78350f" stroke-width="2" />
    
    <text x="60" y="105" fill="#f8fafc" class="mono" font-size="10" text-anchor="middle" font-weight="bold">HOMEMADE</text>
    <text x="60" y="122" fill="#fb923c" class="mono" font-size="9" text-anchor="middle" font-weight="bold">CT COIL</text>

    <!-- CT Burden Resistor Board -->
    <g transform="translate(-10, 230)">
      <rect x="0" y="0" width="140" height="60" rx="6" fill="#18131e" stroke="#fb923c" stroke-width="1.2" />
      <text x="70" y="20" fill="#fb923c" class="mono" font-size="9" text-anchor="middle">BURDEN R: 68.2 Ω</text>
      <text x="70" y="36" fill="#94a3b8" class="mono" font-size="8" text-anchor="middle">Precision Metal Film</text>
      <text x="70" y="50" fill="#38bdf8" class="mono" font-size="8" text-anchor="middle">ADC Peak: 0 - 3.1V</text>
    </g>
  </g>

  <!-- Signal Processing & ESP8266 Core -->
  <g transform="translate(520, 160)">
    <rect x="0" y="0" width="260" height="340" rx="12" fill="#120e18" stroke="#38bdf8" stroke-width="1.8" />
    <rect x="20" y="20" width="220" height="40" rx="6" fill="#1e1828" />
    <text x="130" y="44" fill="#38bdf8" class="mono" font-size="12" text-anchor="middle" font-weight="bold">ESP8266 IoT MCU</text>

    <!-- Signal Conditioning Pipeline -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="220" height="90" rx="6" fill="#0a0710" stroke="#f59e0b" stroke-width="1.2" />
      <text x="110" y="22" fill="#f59e0b" class="mono" font-size="10" text-anchor="middle" font-weight="bold">ANALOG FRONT-END (AFE)</text>
      <text x="15" y="44" fill="#94a3b8" class="mono" font-size="8.5">&#8226; Active DC Bias Offset: 1.65V</text>
      <text x="15" y="60" fill="#94a3b8" class="mono" font-size="8.5">&#8226; Anti-Aliasing Lowpass Filter</text>
      <text x="15" y="76" fill="#94a3b8" class="mono" font-size="8.5">&#8226; Discrete 10-bit ADC Sampling</text>
    </g>

    <!-- Embedded Firmware Logic -->
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="220" height="120" rx="6" fill="#08060d" stroke="#34d399" stroke-width="1.2" />
      <text x="110" y="22" fill="#34d399" class="mono" font-size="10" text-anchor="middle" font-weight="bold">SAFETY &amp; CONTROL LOOP</text>
      <text x="15" y="44" fill="#cbd5e1" class="mono" font-size="8.5">&#8226; True-RMS Calculation</text>
      <text x="15" y="62" fill="#cbd5e1" class="mono" font-size="8.5">&#8226; Thermal Cutoff: 78°C Trip</text>
      <text x="15" y="80" fill="#cbd5e1" class="mono" font-size="8.5">&#8226; Overcurrent Interlock: &gt;16A</text>
      <text x="15" y="98" fill="#f59e0b" class="mono" font-size="8.5">&#8226; Discord Webhook Telemetry</text>
    </g>
  </g>

  <!-- Live Oscilloscope Screen (Right Side) -->
  <g transform="translate(830, 160)">
    <rect x="0" y="0" width="310" height="340" rx="12" fill="#050a0a" stroke="#10b981" stroke-width="2" />
    <rect x="15" y="15" width="280" height="35" rx="5" fill="#071815" />
    <circle cx="35" cy="32" r="5" fill="#10b981" filter="url(#glow-green)" />
    <text x="50" y="36" fill="#10b981" class="mono" font-size="11" font-weight="bold">OSCILLOSCOPE CH1 / CH2</text>
    
    <!-- Reticle Grid -->
    <g stroke="#064e3b" stroke-width="0.8" stroke-dasharray="3 3">
      <path d="M 20,110 L 290,110 M 20,170 L 290,170 M 20,230 L 290,230" />
      <path d="M 85,60 L 85,280 M 155,60 L 155,280 M 225,60 L 225,280" />
    </g>

    <!-- AC Voltage Sine Wave (Yellow) -->
    <path d="M 25,170 Q 55,70 85,170 T 145,170 T 205,170 T 265,170 T 290,170" fill="none" stroke="#fbbf24" stroke-width="2.5" filter="url(#glow-amber)" />
    
    <!-- AC Current Waveform (Cyan) showing slight inductive phase shift -->
    <path d="M 25,185 Q 65,110 95,185 T 155,185 T 215,185 T 275,185 T 290,185" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.9" filter="url(#glow-cyan2)" />

    <!-- Waveform Metrics Readout -->
    <g transform="translate(25, 290)">
      <text x="0" y="15" fill="#fbbf24" class="mono" font-size="10" font-weight="bold">V_RMS: 231.4 V</text>
      <text x="140" y="15" fill="#38bdf8" class="mono" font-size="10" font-weight="bold">I_RMS: 8.42 A</text>
      <text x="0" y="32" fill="#34d399" class="mono" font-size="9">POWER: 1948 W (PF: 0.96)</text>
      <text x="140" y="32" fill="#cbd5e1" class="mono" font-size="9">TEMP: 38.6 °C</text>
    </g>
  </g>

  <!-- Technical Telemetry Footer -->
  <g transform="translate(60, 560)">
    <rect x="0" y="0" width="1080" height="75" rx="8" fill="#100b16" stroke="#2a1f33" stroke-width="1.2" />
    <g transform="translate(25, 25)">
      <text x="0" y="0" fill="#f59e0b" class="mono" font-size="11" font-weight="bold">CUSTOM SENSING HARDWARE INTEGRATION</text>
      <text x="0" y="24" fill="#94a3b8" class="mono" font-size="10">Homemade High-Permeability CT Core &#8226; Precision AC Voltage Divider &#8226; Galvanic Isolation &#8226; Automated Discord Webhook Anomaly Dispatches</text>
    </g>
    <g transform="translate(860, 28)">
      <rect x="0" y="0" width="190" height="28" rx="4" fill="#251a2e" />
      <text x="95" y="18" fill="#f59e0b" class="mono" font-size="10" text-anchor="middle" font-weight="bold">TELEMETRY: ACTIVE</text>
    </g>
  </g>
</svg>
