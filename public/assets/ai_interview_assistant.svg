<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-ai" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#150f28" />
      <stop offset="50%" stop-color="#0a0715" />
      <stop offset="100%" stop-color="#020106" />
    </radialGradient>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="spec-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="40%" stop-color="#8b5cf6" />
      <stop offset="80%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', monospace, 'Courier New'; }
    .sans { font-family: 'Space Grotesk', -apple-system, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bg-ai)" />

  <!-- Digital Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 0,75 L 1200,75 M 0,150 L 1200,150 M 0,225 L 1200,225 M 0,300 L 1200,300 M 0,375 L 1200,375 M 0,450 L 1200,450 M 0,525 L 1200,525 M 0,600 L 1200,600" />
    <path d="M 100,0 L 100,675 M 200,0 L 200,675 M 300,0 L 300,675 M 400,0 L 400,675 M 500,0 L 500,675 M 600,0 L 600,675 M 700,0 L 700,675 M 800,0 L 800,675 M 900,0 L 900,675 M 1000,0 L 1000,675 M 1100,0 L 1100,675" />
  </g>

  <!-- Title Banner -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="560" height="42" rx="6" fill="#1b122e" stroke="#4c2c77" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#a855f7" filter="url(#glow-purple)" />
    <text x="36" y="26" fill="#f8fafc" class="mono" font-size="13" font-weight="bold" letter-spacing="1.5">AI_SUBSYSTEM // MULTIMODAL INTERVIEW INTELLIGENCE</text>
    <text x="445" y="26" fill="#c084fc" class="mono" font-size="11">WHISPER + LLAMA-3</text>
  </g>

  <!-- Left: Computer Vision Facial Mesh & Emotion Topology -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="340" height="360" rx="12" fill="#0d0918" stroke="#a855f7" stroke-width="1.8" />
    <rect x="15" y="15" width="310" height="35" rx="5" fill="#170f2b" />
    <circle cx="35" cy="32" r="5" fill="#a855f7" filter="url(#glow-purple)" />
    <text x="50" y="36" fill="#c084fc" class="mono" font-size="11" font-weight="bold">VISION: 468-PT FACIAL MESH</text>

    <!-- Holographic Face Mesh Wireframe -->
    <g transform="translate(170, 190)" stroke="#a855f7" stroke-width="1" fill="none" opacity="0.85">
      <!-- Head Contour -->
      <ellipse cx="0" cy="0" rx="75" ry="95" stroke="#7e22ce" stroke-width="1.5" />
      <path d="M -50,-40 L 50,-40 L 0,-85 Z" />
      <!-- Eyes & Brows Nodes -->
      <polygon points="-45,-25 -20,-25 -32,-35" stroke="#38bdf8" />
      <polygon points="20,-25 45,-25 32,-35" stroke="#38bdf8" />
      <circle cx="-32" cy="-25" r="4" fill="#38bdf8" filter="url(#glow-cyan3)" />
      <circle cx="32" cy="-25" r="4" fill="#38bdf8" filter="url(#glow-cyan3)" />
      <!-- Gaze Tracking Vector Rays -->
      <line x1="-32" y1="-25" x2="-32" y2="40" stroke="#38bdf8" stroke-dasharray="2 2" stroke-width="1" />
      <line x1="32" y1="-25" x2="32" y2="40" stroke="#38bdf8" stroke-dasharray="2 2" stroke-width="1" />
      <!-- Nose Ridge -->
      <path d="M 0,-30 L -12,15 L 12,15 Z" stroke="#c084fc" />
      <!-- Mouth Mesh -->
      <path d="M -30,45 Q 0,35 30,45 Q 0,60 -30,45" stroke="#ec4899" />
      <!-- Jawline Vertices -->
      <polyline points="-65,10 -45,65 0,85 45,65 65,10" stroke="#6b21a8" />
    </g>

    <!-- Vision Telemetry Overlay -->
    <g transform="translate(20, 310)">
      <rect x="0" y="0" width="300" height="35" rx="4" fill="#170f2b" />
      <text x="12" y="22" fill="#34d399" class="mono" font-size="9" font-weight="bold">EYE CONTACT: 94.8%</text>
      <text x="160" y="22" fill="#c084fc" class="mono" font-size="9" font-weight="bold">CONFIDENCE: HIGH</text>
    </g>
  </g>

  <!-- Middle: Whisper Speech-to-Text Acoustic Pipeline -->
  <g transform="translate(430, 150)">
    <rect x="0" y="0" width="370" height="360" rx="12" fill="#0d0918" stroke="#38bdf8" stroke-width="1.8" />
    <rect x="15" y="15" width="340" height="35" rx="5" fill="#0c172a" />
    <circle cx="35" cy="32" r="5" fill="#38bdf8" filter="url(#glow-cyan3)" />
    <text x="50" y="36" fill="#38bdf8" class="mono" font-size="11" font-weight="bold">AUDIO: WHISPER ASR SPECTROGRAM</text>

    <!-- Live Audio Waterfall Spectrogram Bars -->
    <g transform="translate(25, 75)">
      <!-- 28 frequency bin bars with gradient -->
      <!-- Heights simulated based on vocal spectrum -->
      <rect x="0" y="60" width="8" height="60" rx="2" fill="url(#spec-grad)" />
      <rect x="12" y="40" width="8" height="80" rx="2" fill="url(#spec-grad)" />
      <rect x="24" y="20" width="8" height="100" rx="2" fill="url(#spec-grad)" />
      <rect x="36" y="10" width="8" height="110" rx="2" fill="url(#spec-grad)" />
      <rect x="48" y="25" width="8" height="95" rx="2" fill="url(#spec-grad)" />
      <rect x="60" y="50" width="8" height="70" rx="2" fill="url(#spec-grad)" />
      <rect x="72" y="30" width="8" height="90" rx="2" fill="url(#spec-grad)" />
      <rect x="84" y="15" width="8" height="105" rx="2" fill="url(#spec-grad)" />
      <rect x="96" y="35" width="8" height="85" rx="2" fill="url(#spec-grad)" />
      <rect x="108" y="55" width="8" height="65" rx="2" fill="url(#spec-grad)" />
      <rect x="120" y="20" width="8" height="100" rx="2" fill="url(#spec-grad)" />
      <rect x="132" y="8" width="8" height="112" rx="2" fill="url(#spec-grad)" />
      <rect x="144" y="28" width="8" height="92" rx="2" fill="url(#spec-grad)" />
      <rect x="156" y="45" width="8" height="75" rx="2" fill="url(#spec-grad)" />
      <rect x="168" y="18" width="8" height="102" rx="2" fill="url(#spec-grad)" />
      <rect x="180" y="38" width="8" height="82" rx="2" fill="url(#spec-grad)" />
      <rect x="192" y="65" width="8" height="55" rx="2" fill="url(#spec-grad)" />
      <rect x="204" y="32" width="8" height="88" rx="2" fill="url(#spec-grad)" />
      <rect x="216" y="12" width="8" height="108" rx="2" fill="url(#spec-grad)" />
      <rect x="228" y="42" width="8" height="78" rx="2" fill="url(#spec-grad)" />
      <rect x="240" y="70" width="8" height="50" rx="2" fill="url(#spec-grad)" />
      <rect x="252" y="25" width="8" height="95" rx="2" fill="url(#spec-grad)" />
      <rect x="264" y="48" width="8" height="72" rx="2" fill="url(#spec-grad)" />
      <rect x="276" y="60" width="8" height="60" rx="2" fill="url(#spec-grad)" />
      <rect x="288" y="80" width="8" height="40" rx="2" fill="url(#spec-grad)" />
      <rect x="300" y="90" width="8" height="30" rx="2" fill="url(#spec-grad)" />
      <rect x="312" y="95" width="8" height="25" rx="2" fill="url(#spec-grad)" />
    </g>

    <!-- Transcribed Speech Stream Box -->
    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="330" height="85" rx="6" fill="#080e1a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="22" fill="#38bdf8" class="mono" font-size="9" font-weight="bold">WHISPER STREAMING TRANSCRIPT:</text>
      <text x="12" y="44" fill="#f8fafc" class="sans" font-size="11">"I optimized the time complexity to O(N log N)..."</text>
      <text x="12" y="64" fill="#94a3b8" class="mono" font-size="9">Latency: 110ms &#8226; Word Error Rate: 1.2%</text>
    </g>

    <!-- Speech Pace Metric -->
    <g transform="translate(20, 318)">
      <text x="0" y="18" fill="#34d399" class="mono" font-size="9">SPEECH PACE: 136 WPM [OPTIMAL]</text>
      <text x="210" y="18" fill="#fbbf24" class="mono" font-size="9">FILLER WORDS: 0.8%</text>
    </g>
  </g>

  <!-- Right: Groq LLaMA-3 Real-Time Reasoning Engine -->
  <g transform="translate(830, 150)">
    <rect x="0" y="0" width="310" height="360" rx="12" fill="#0d0918" stroke="#f59e0b" stroke-width="1.8" />
    <rect x="15" y="15" width="280" height="35" rx="5" fill="#1f1406" />
    <circle cx="35" cy="32" r="5" fill="#f59e0b" filter="url(#glow-purple)" />
    <text x="50" y="36" fill="#fbbf24" class="mono" font-size="11" font-weight="bold">GROQ LPU // LLAMA-3 70B</text>

    <!-- Neural Evaluation Terminal -->
    <g transform="translate(18, 70)">
      <rect x="0" y="0" width="274" height="150" rx="6" fill="#09060f" stroke="#332210" stroke-width="1" />
      <text x="12" y="22" fill="#f59e0b" class="mono" font-size="9" font-weight="bold">&gt; ADAPTIVE INTERVIEW PROMPT</text>
      <text x="12" y="44" fill="#e2e8f0" class="mono" font-size="9.5">Candidate answered DSA question.</text>
      <text x="12" y="60" fill="#e2e8f0" class="mono" font-size="9.5">Generating targeted follow-up on</text>
      <text x="12" y="76" fill="#38bdf8" class="mono" font-size="9.5">memory bounds and concurrency.</text>
      
      <line x1="12" y1="92" x2="262" y2="92" stroke="#1f2937" stroke-width="1" />
      <text x="12" y="112" fill="#34d399" class="mono" font-size="9">&gt; INFERENCE: 285 tokens/sec</text>
      <text x="12" y="130" fill="#94a3b8" class="mono" font-size="8.5">GROQ LPUs &#8226; Zero Server Cold Start</text>
    </g>

    <!-- Overall Evaluation Badge -->
    <g transform="translate(18, 240)">
      <rect x="0" y="0" width="274" height="100" rx="8" fill="#130d22" stroke="#a855f7" stroke-width="1" />
      <text x="15" y="24" fill="#c084fc" class="mono" font-size="10" font-weight="bold">COMPREHENSIVE SCORE</text>
      <text x="15" y="60" fill="#f8fafc" class="sans" font-size="28" font-weight="bold">92<tspan font-size="16" fill="#94a3b8">/100</tspan></text>
      <text x="120" y="50" fill="#34d399" class="mono" font-size="9">&#8226; Technical: 96%</text>
      <text x="120" y="66" fill="#38bdf8" class="mono" font-size="9">&#8226; Articulation: 88%</text>
      <text x="120" y="82" fill="#fbbf24" class="mono" font-size="9">&#8226; Body Language: 92%</text>
    </g>
  </g>

  <!-- Technical Telemetry Footer -->
  <g transform="translate(60, 560)">
    <rect x="0" y="0" width="1080" height="75" rx="8" fill="#0d0918" stroke="#2c1a45" stroke-width="1.2" />
    <g transform="translate(25, 25)">
      <text x="0" y="0" fill="#c084fc" class="mono" font-size="11" font-weight="bold">END-TO-END MULTIMODAL ARCHITECTURE</text>
      <text x="0" y="24" fill="#94a3b8" class="mono" font-size="10">Flask Microservice &#8226; WebRTC Audio Streaming &#8226; MediaPipe Face Landmarks &#8226; Groq LPU LLaMA 3 70B &#8226; Comprehensive Performance Analytics</text>
    </g>
    <g transform="translate(860, 28)">
      <rect x="0" y="0" width="190" height="28" rx="4" fill="#201336" />
      <text x="95" y="18" fill="#a855f7" class="mono" font-size="10" text-anchor="middle" font-weight="bold">FULL-STACK AI</text>
    </g>
  </g>
</svg>
