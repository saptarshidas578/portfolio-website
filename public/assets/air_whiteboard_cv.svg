<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-cv" cx="40%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c192c" />
      <stop offset="50%" stop-color="#060c17" />
      <stop offset="100%" stop-color="#010408" />
    </radialGradient>

    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-laser" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', monospace, 'Courier New'; }
    .sans { font-family: 'Space Grotesk', -apple-system, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bg-cv)" />

  <!-- Coordinate Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M 0,75 L 1200,75 M 0,150 L 1200,150 M 0,225 L 1200,225 M 0,300 L 1200,300 M 0,375 L 1200,375 M 0,450 L 1200,450 M 0,525 L 1200,525 M 0,600 L 1200,600" />
    <path d="M 100,0 L 100,675 M 200,0 L 200,675 M 300,0 L 300,675 M 400,0 L 400,675 M 500,0 L 500,675 M 600,0 L 600,675 M 700,0 L 700,675 M 800,0 L 800,675 M 900,0 L 900,675 M 1000,0 L 1000,675 M 1100,0 L 1100,675" />
  </g>

  <!-- Title Banner -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="560" height="42" rx="6" fill="#0c1c2e" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#38bdf8" filter="url(#glow-teal)" />
    <text x="36" y="26" fill="#f8fafc" class="mono" font-size="13" font-weight="bold" letter-spacing="1.5">SPATIAL_CV // AIR WHITEBOARD &amp; OCR GESTURE ENGINE</text>
    <text x="430" y="26" fill="#38bdf8" class="mono" font-size="11">MEDIAPIPE 21-NODE</text>
  </g>

  <!-- Left: 21-Node Skeletal Hand Mesh -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="380" height="360" rx="12" fill="#07111e" stroke="#0284c7" stroke-width="1.8" />
    <rect x="15" y="15" width="350" height="35" rx="5" fill="#0c1e33" />
    <circle cx="35" cy="32" r="5" fill="#38bdf8" filter="url(#glow-teal)" />
    <text x="50" y="36" fill="#38bdf8" class="mono" font-size="11" font-weight="bold">MEDIAPIPE HAND TOPOLOGY</text>

    <!-- Hand Skeletal Bones & Joint Nodes -->
    <g transform="translate(190, 210)">
      <!-- Wrist 0 -->
      <circle cx="0" cy="80" r="5" fill="#38bdf8" />
      
      <!-- Thumb (1-4) -->
      <line x1="0" y1="80" x2="-45" y2="50" stroke="#0284c7" stroke-width="2" />
      <line x1="-45" y1="50" x2="-75" y2="25" stroke="#0284c7" stroke-width="2" />
      <line x1="-75" y1="25" x2="-95" y2="0" stroke="#0284c7" stroke-width="2" />
      <line x1="-95" y1="0" x2="-105" y2="-20" stroke="#0284c7" stroke-width="2" />
      <circle cx="-45" cy="50" r="4" fill="#38bdf8" />
      <circle cx="-75" cy="25" r="4" fill="#38bdf8" />
      <circle cx="-95" cy="0" r="4" fill="#38bdf8" />
      <circle cx="-105" cy="-20" r="5" fill="#fbbf24" />

      <!-- Index Finger (5-8) Drawing Finger! -->
      <line x1="0" y1="80" x2="-35" y2="0" stroke="#38bdf8" stroke-width="2.5" />
      <line x1="-35" y1="0" x2="-40" y2="-40" stroke="#38bdf8" stroke-width="2.5" />
      <line x1="-40" y1="-40" x2="-42" y2="-80" stroke="#38bdf8" stroke-width="2.5" />
      <line x1="-42" y1="-80" x2="-43" y2="-120" stroke="#38bdf8" stroke-width="3" />
      <circle cx="-35" cy="0" r="4" fill="#38bdf8" />
      <circle cx="-40" cy="-40" r="4" fill="#38bdf8" />
      <circle cx="-42" cy="-80" r="5" fill="#38bdf8" />
      
      <!-- FINGERTIP POINTER TIP with Neon Laser Emission -->
      <circle cx="-43" cy="-120" r="8" fill="#38bdf8" filter="url(#glow-laser)" />
      <circle cx="-43" cy="-120" r="3" fill="#ffffff" />
      <text x="-35" y="-128" fill="#38bdf8" class="mono" font-size="10" font-weight="bold">TIP_8 (PEN DOWN)</text>

      <!-- Middle Finger (9-12) -->
      <line x1="0" y1="80" x2="0" y2="-10" stroke="#0284c7" stroke-width="1.8" />
      <line x1="0" y1="-10" x2="0" y2="-55" stroke="#0284c7" stroke-width="1.8" />
      <line x1="0" y1="-55" x2="0" y2="-95" stroke="#0284c7" stroke-width="1.8" />
      <line x1="0" y1="-95" x2="0" y2="-130" stroke="#0284c7" stroke-width="1.8" />
      <circle cx="0" cy="-10" r="3.5" fill="#38bdf8" />
      <circle cx="0" cy="-55" r="3.5" fill="#38bdf8" />
      <circle cx="0" cy="-95" r="3.5" fill="#38bdf8" />
      <circle cx="0" cy="-130" r="4" fill="#64748b" />

      <!-- Ring Finger (13-16) -->
      <line x1="0" y1="80" x2="35" y2="0" stroke="#0284c7" stroke-width="1.5" />
      <line x1="35" y1="0" x2="40" y2="-45" stroke="#0284c7" stroke-width="1.5" />
      <line x1="40" y1="-45" x2="42" y2="-85" stroke="#0284c7" stroke-width="1.5" />
      <line x1="42" y1="-85" x2="43" y2="-115" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="35" cy="0" r="3.5" fill="#38bdf8" />
      <circle cx="40" cy="-45" r="3.5" fill="#38bdf8" />
      <circle cx="42" cy="-85" r="3.5" fill="#38bdf8" />
      <circle cx="43" cy="-115" r="4" fill="#64748b" />

      <!-- Pinky (17-20) -->
      <line x1="0" y1="80" x2="65" y2="15" stroke="#0284c7" stroke-width="1.5" />
      <line x1="65" y1="15" x2="75" y2="-25" stroke="#0284c7" stroke-width="1.5" />
      <line x1="75" y1="-25" x2="80" y2="-60" stroke="#0284c7" stroke-width="1.5" />
      <line x1="80" y1="-60" x2="82" y2="-85" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="65" cy="15" r="3.5" fill="#38bdf8" />
      <circle cx="75" cy="-25" r="3.5" fill="#38bdf8" />
      <circle cx="80" cy="-60" r="3.5" fill="#38bdf8" />
      <circle cx="82" cy="-85" r="4" fill="#64748b" />
    </g>

    <!-- Gesture State Footer -->
    <g transform="translate(20, 310)">
      <rect x="0" y="0" width="340" height="35" rx="4" fill="#0c1e33" />
      <text x="15" y="22" fill="#34d399" class="mono" font-size="9" font-weight="bold">STATE: DRAWING (PINCH DIST: 22px)</text>
      <text x="250" y="22" fill="#38bdf8" class="mono" font-size="9">60 FPS</text>
    </g>
  </g>

  <!-- Middle: Canvas Drawing Plane with EMA Filter Smoothing -->
  <g transform="translate(470, 150)">
    <rect x="0" y="0" width="370" height="360" rx="12" fill="#07111e" stroke="#38bdf8" stroke-width="1.8" />
    <rect x="15" y="15" width="340" height="35" rx="5" fill="#0c1e33" />
    <circle cx="35" cy="32" r="5" fill="#34d399" filter="url(#glow-teal)" />
    <text x="50" y="36" fill="#34d399" class="mono" font-size="11" font-weight="bold">SMOOTHED TRAJECTORY CANVAS</text>

    <!-- Raw Jittery Input Path (Dotted Red) vs EMA Filtered Path (Solid Cyan Glow) -->
    <g transform="translate(30, 75)">
      <!-- Jittery Raw Points -->
      <path d="M 20,130 L 40,85 L 43,88 L 65,55 L 75,50 L 95,95 L 120,40 L 145,130 L 180,60 L 210,65 L 240,40 L 270,120" fill="none" stroke="#ef4444" stroke-dasharray="2 3" stroke-width="1.2" opacity="0.6" />
      
      <!-- EMA Smoothed Continuous Bezier Stroke -->
      <path d="M 20,130 Q 50,45 80,70 T 140,80 T 200,45 T 260,110 T 300,70" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#glow-laser)" />
      
      <circle cx="300" cy="70" r="7" fill="#38bdf8" filter="url(#glow-laser)" />
      <circle cx="300" cy="70" r="3" fill="#ffffff" />
    </g>

    <!-- Filter Comparison Legend -->
    <g transform="translate(25, 230)">
      <line x1="0" y1="10" x2="30" y2="10" stroke="#ef4444" stroke-dasharray="2 3" stroke-width="2" />
      <text x="38" y="14" fill="#f87171" class="mono" font-size="9">Raw Webcam Coordinate (Jitter: &#177;4.8px)</text>

      <line x1="0" y1="30" x2="30" y2="30" stroke="#38bdf8" stroke-width="3" />
      <text x="38" y="34" fill="#38bdf8" class="mono" font-size="9">EMA Alpha: 0.65 (Jitter: &lt;0.4px)</text>
    </g>

    <!-- Real-Time Metrics -->
    <g transform="translate(25, 305)">
      <rect x="0" y="0" width="320" height="38" rx="4" fill="#0c1e33" />
      <text x="12" y="24" fill="#fbbf24" class="mono" font-size="9" font-weight="bold">KALMAN SMOOTHING: ENABLED</text>
      <text x="210" y="24" fill="#34d399" class="mono" font-size="9">LATENCY: 8ms</text>
    </g>
  </g>

  <!-- Right: EasyOCR Character Recognition Box -->
  <g transform="translate(870, 150)">
    <rect x="0" y="0" width="270" height="360" rx="12" fill="#07111e" stroke="#fbbf24" stroke-width="1.8" />
    <rect x="15" y="15" width="240" height="35" rx="5" fill="#1e1808" />
    <circle cx="35" cy="32" r="5" fill="#fbbf24" filter="url(#glow-teal)" />
    <text x="50" y="36" fill="#fbbf24" class="mono" font-size="11" font-weight="bold">EASYOCR ENGINE</text>

    <!-- OCR Bounding Box & Recognition Output -->
    <g transform="translate(18, 70)">
      <rect x="0" y="0" width="234" height="150" rx="6" fill="#0a0f18" stroke="#3b2d10" stroke-width="1" />
      <text x="12" y="22" fill="#fbbf24" class="mono" font-size="9" font-weight="bold">&gt; OCR STROKE SEGMENTATION</text>
      
      <!-- Bounding Box around Recognized Equation -->
      <rect x="12" y="38" width="210" height="42" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 2" />
      <text x="20" y="64" fill="#38bdf8" class="mono" font-size="14" font-weight="bold">E = mc² + ∇φ</text>

      <line x1="12" y1="92" x2="222" y2="92" stroke="#1f2937" stroke-width="1" />
      <text x="12" y="112" fill="#34d399" class="mono" font-size="9">Confidence: 99.2%</text>
      <text x="12" y="130" fill="#cbd5e1" class="mono" font-size="8.5">Auto-converted to LaTeX / Markdown</text>
    </g>

    <!-- Gesture Commands Guide -->
    <g transform="translate(18, 235)">
      <rect x="0" y="0" width="234" height="110" rx="6" fill="#0c1825" stroke="#1e3a5f" stroke-width="1" />
      <text x="12" y="22" fill="#38bdf8" class="mono" font-size="9" font-weight="bold">GESTURE DICTIONARY</text>
      <text x="12" y="44" fill="#94a3b8" class="mono" font-size="8.5">&#8226; Index Extended &#8594; Laser Draw</text>
      <text x="12" y="62" fill="#94a3b8" class="mono" font-size="8.5">&#8226; Open Palm &#8594; Clear / Erase</text>
      <text x="12" y="80" fill="#94a3b8" class="mono" font-size="8.5">&#8226; Closed Fist &#8594; Freeze Frame</text>
      <text x="12" y="98" fill="#fbbf24" class="mono" font-size="8.5">&#8226; Two Fingers &#8594; Color Palette</text>
    </g>
  </g>

  <!-- Technical Telemetry Footer -->
  <g transform="translate(60, 560)">
    <rect x="0" y="0" width="1080" height="75" rx="8" fill="#07111e" stroke="#1e3a5f" stroke-width="1.2" />
    <g transform="translate(25, 25)">
      <text x="0" y="0" fill="#38bdf8" class="mono" font-size="11" font-weight="bold">CONTACTLESS INTERACTION ENGINE</text>
      <text x="0" y="24" fill="#94a3b8" class="mono" font-size="10">Python OpenCV Pipeline &#8226; Sub-millisecond MediaPipe CPU Inferences &#8226; Real-time LaTeX Export &#8226; 60 FPS Contactless Spatial Interface</text>
    </g>
    <g transform="translate(860, 28)">
      <rect x="0" y="0" width="190" height="28" rx="4" fill="#0c233c" />
      <text x="95" y="18" fill="#38bdf8" class="mono" font-size="10" text-anchor="middle" font-weight="bold">ZERO HARDWARE LAG</text>
    </g>
  </g>
</svg>
